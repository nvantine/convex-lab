[project]
name = "convex-lab"
version = "0.1.0"
description = "An editable convex optimization notebook with visible mathematics"
requires-python = ">=3.13,<3.14"
dependencies = [
  "django==6.1.1",
  "cvxpy==1.9.3",
  "numpy==2.5.3",
  "plotly==7.1.0",
  "python-dotenv==1.2.4",
  "pandas==3.0.6",
  "scikit-learn==1.9.1",
  "alpaca-py==0.44.0",
  "yfinance==1.7.0",
  "gunicorn==26.2.0",
]

[project.scripts]
convex-lab = "lab.cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "lab*", "config*"]

[tool.setuptools.package-data]
lab = ["templates/lab/*.html", "static/**/*"]


[dependency-groups]
dev = ["pytest==9.1.1", "pytest-django==4.14.0", "playwright==1.63.0"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["browser: real Chromium tests (run separately)"]
addopts = "-m 'not browser'"
